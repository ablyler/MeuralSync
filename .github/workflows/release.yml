name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_VERSION}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build release app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh
          codesign --verify --strict dist/MeuralSync.app

      - name: Package zip & generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          mkdir -p release_assets
          ZIP_NAME="MeuralSync-${RELEASE_TAG}.zip"
          ditto -c -k --keepParent dist/MeuralSync.app "release_assets/${ZIP_NAME}"

          python3 scripts/extract_release_notes.py "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --repo "$REPO_SLUG" \
            --markdown-out /tmp/release_notes.md \
            --html-out "release_assets/MeuralSync-${RELEASE_TAG}.html"

          if [ -n "$SPARKLE_PRIVATE_ED_KEY" ]; then
            GENERATE_APPCAST=$(find .build/artifacts -name "generate_appcast" -type f | head -n 1)
            if [ -z "$GENERATE_APPCAST" ]; then
              echo "generate_appcast not found in .build/artifacts; downloading Sparkle tools..."
              SPARKLE_VER=$(python3 -c 'import json; p=json.load(open("Package.resolved")); print([x["state"]["version"] for x in p["pins"] if x["identity"].lower()=="sparkle"][0])')
              curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" -o /tmp/sparkle.tar.xz
              mkdir -p /tmp/sparkle-tools
              tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
              GENERATE_APPCAST="/tmp/sparkle-tools/bin/generate_appcast"
            fi
            echo "$SPARKLE_PRIVATE_ED_KEY" | "$GENERATE_APPCAST" \
              --ed-key-file - \
              --embed-release-notes \
              --download-url-prefix "https://github.com/${REPO_SLUG}/releases/download/${RELEASE_TAG}/" \
              release_assets
          else
            echo "SPARKLE_PRIVATE_ED_KEY secret not set; skipping appcast.xml generation."
          fi

          # Remove sidecar HTML after embedding into appcast.xml so only the zip & appcast are uploaded.
          rm -f "release_assets/MeuralSync-${RELEASE_TAG}.html"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release_assets/* \
            --target "$GITHUB_SHA" \
            --title "MeuralSync $RELEASE_TAG" \
            --notes-file /tmp/release_notes.md

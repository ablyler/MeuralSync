<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS App Icon Squircle Backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <!-- Subtle top sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Warm wooden/gallery frame border -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Photo sunset sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#818CF8"/>
      <stop offset="82%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Distant mountain -->
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Front mountain -->
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Sync badge gradient -->
    <linearGradient id="syncBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <clipPath id="photoClip">
      <rect x="292" y="222" width="440" height="580" rx="20"/>
    </clipPath>
  </defs>

  <!-- macOS HIG icon canvas (824x824 centered inside 1024x1024) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- Portrait Meural Digital Frame (outer frame + gallery mat) -->
  <g filter="url(#dropShadow)">
    <rect x="248" y="178" width="528" height="668" rx="44" fill="url(#frameBorder)"/>
    <rect x="272" y="202" width="480" height="620" rx="28" fill="#0F172A"/>
  </g>

  <!-- Artwork inside the Meural frame -->
  <g clip-path="url(#photoClip)">
    <rect x="292" y="222" width="440" height="580" fill="url(#skyGrad)"/>
    <!-- Glowing sun -->
    <circle cx="590" cy="370" r="64" fill="#FEF3C7" fill-opacity="0.92"/>
    <circle cx="590" cy="370" r="96" fill="#FDE68A" fill-opacity="0.22"/>
    <!-- Back ridge -->
    <path d="M270 610 L430 430 L565 555 L655 470 L760 610 L760 820 L270 820 Z" fill="url(#mtnBack)"/>
    <!-- Front ridge -->
    <path d="M270 680 L385 520 L515 640 L635 535 L760 695 L760 820 L270 820 Z" fill="url(#mtnFront)"/>
    <!-- Subtle MeuralSync caption pill inside the photo -->
    <rect x="316" y="246" width="196" height="54" rx="12" fill="#000000" fill-opacity="0.52"/>
    <rect x="332" y="261" width="112" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="332" y="279" width="154" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.62"/>
  </g>

  <!-- Crisp Sync Badge in bottom-right -->
  <g filter="url(#badgeShadow)">
    <circle cx="726" cy="744" r="108" fill="url(#syncBadge)"/>
    <circle cx="726" cy="744" r="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"/>
    <!-- Two clean opposing sync arcs + arrowheads -->
    <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M674 734 A54 54 0 0 1 772 716"/>
      <path d="M776 688 L774 720 L742 718"/>
      <path d="M778 754 A54 54 0 0 1 680 772"/>
      <path d="M676 800 L678 768 L710 770"/>
    </g>
  </g>
</svg>
